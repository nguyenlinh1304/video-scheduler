<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connected – Video Scheduler</title><style>body{margin:0;font:16px/1.65 -apple-system,Segoe UI,Arial,sans-serif;color:#1d1d1f;background:#fafafa}
header{background:#111;color:#fff;padding:14px 20px}header a{color:#fff;text-decoration:none;margin-right:18px;font-size:15px}header b{margin-right:28px}
main{max-width:820px;margin:0 auto;padding:28px 20px 60px}h1{font-size:30px;margin:8px 0 18px}h3{margin:26px 0 6px}
.box{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:18px}code{background:#f1f1f1;padding:2px 6px;border-radius:4px;word-break:break-all}
button{background:#fe2c55;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer}</style></head><body>
<header><b>Video Scheduler</b><a href="./">Home</a><a href="privacy-policy.html">Privacy Policy</a><a href="terms-of-service.html">Terms of Service</a></header>
<main><h1>TikTok account authorized</h1>
<div class="box" id="ok"><p>Copy this page's address and paste it into Video Scheduler to finish connecting.<br><span style="color:#666">Copy địa chỉ trang này và dán vào Video Scheduler để hoàn tất kết nối.</span></p>
<p><button id="copy">Copy address</button> <span id="msg"></span></p><p><code id="url"></code></p></div>
<script>
const q = new URLSearchParams(location.search);
if (q.get('error')) document.getElementById('ok').innerHTML = '<p>Authorization was cancelled or failed: <code>' + (q.get('error_description') || q.get('error')).replace(/[<>&]/g, '') + '</code></p>';
else {
  document.getElementById('url').textContent = location.href;
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(location.href).then(() => (document.getElementById('msg').textContent = '✓ Copied'));
}
</script></main></body></html>
